<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LEGO Studio 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0f1a;
      --panel: rgba(20, 25, 40, 0.92);
      --panel-border: rgba(255,255,255,0.08);
      --accent: #ffd76d;
      --accent-2: #7fe7ff;
      --text: #f6f7fb;
      --muted: #9aa4c7;
      --shadow: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "SF Pro Text", system-ui, sans-serif;
      background: radial-gradient(circle at top, #141b2e, #080a12 60%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    #app {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100vh;
      width: 100vw;
    }
    #panel {
      position: relative;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      padding: 16px 16px 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: transform 0.3s ease;
      box-shadow: 12px 0 40px var(--shadow);
    }
    #panel.collapsed {
      transform: translateX(-100%);
    }
    #panelToggle {
      position: absolute;
      right: -32px;
      top: 24px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 8px;
      cursor: pointer;
      box-shadow: 0 10px 20px var(--shadow);
    }
    #canvasWrap {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    canvas { display: block; }

    h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      color: transparent;
    }
    .section {
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 12px;
      background: rgba(14, 18, 30, 0.7);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }
    .section h2 {
      margin: 0 0 8px;
      font-size: 14px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      gap: 8px;
    }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .pill {
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .pill:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
    .pill.active { background: rgba(255,215,109,0.2); border-color: rgba(255,215,109,0.6); }
    .palette {
      max-height: 220px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      padding-right: 4px;
    }
    .palette::-webkit-scrollbar { width: 6px; }
    .palette::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 999px; }
    .part-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px;
      font-size: 11px;
      cursor: grab;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .part-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); }
    .part-card strong { font-size: 12px; }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .color-swatch {
      border-radius: 6px;
      height: 18px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar button, .toolbar select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar button:hover { border-color: rgba(255,255,255,0.3); }
    .tag {
      font-size: 11px;
      color: var(--muted);
    }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #selectBox {
      position: absolute;
      border: 1px dashed rgba(127, 231, 255, 0.8);
      background: rgba(127,231,255,0.15);
      display: none;
    }
    #toast {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(20,25,40,0.85);
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #thumbs { display: grid; gap: 6px; grid-template-columns: repeat(2, 1fr); }
    .thumb {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }
    .thumb img { width: 100%; display: block; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="panel">
      <button id="panelToggle" aria-label="Toggle panel">☰</button>
      <h1>LEGO <span>Studio 3D</span></h1>

      <div class="section">
        <h2>Toolset</h2>
        <div class="toolbar">
          <button id="undoBtn">Undo</button>
          <button id="redoBtn">Redo</button>
          <button id="clearBtn">Clear</button>
          <button id="gridToggle">Grid Snap: On</button>
          <button id="angleToggle">Angle Snap: On</button>
          <select id="baseplateSelect">
            <option value="16">Baseplate 16x16</option>
            <option value="32" selected>Baseplate 32x32</option>
            <option value="48">Baseplate 48x48</option>
            <option value="64">Baseplate 64x64</option>
          </select>
        </div>
        <div class="tag">Q/E rotate · Right drag rotate · Shift+drag select · Ctrl+C/V</div>
      </div>

      <div class="section">
        <h2>Part Library</h2>
        <div class="grid cols-2" id="partTabs"></div>
        <div class="palette" id="partPalette"></div>
      </div>

      <div class="section">
        <h2>Color Lab</h2>
        <div class="color-grid" id="colorGrid"></div>
      </div>

      <div class="section">
        <h2>Templates</h2>
        <div class="grid cols-2" id="templateGrid"></div>
      </div>

      <div class="section">
        <h2>Projects</h2>
        <div class="toolbar">
          <button id="saveBtn">Save</button>
          <button id="exportBtn">Export JSON</button>
          <button id="importBtn">Import JSON</button>
        </div>
        <div id="thumbs"></div>
      </div>
    </aside>

    <main id="canvasWrap">
      <canvas id="c"></canvas>
      <div id="overlay">
        <div id="selectBox"></div>
        <div id="toast"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.159.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.159.0/examples/jsm/controls/OrbitControls.js";

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f1c);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(18, 22, 22);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = false;
    controls.enablePan = false;
    controls.maxPolarAngle = Math.PI * 0.49;

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0x88aaff, 0x202036, 0.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(30, 50, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 200;
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    scene.add(sun);

    const glow = new THREE.PointLight(0x7fe7ff, 0.6, 100);
    glow.position.set(-20, 18, -10);
    scene.add(glow);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.ShadowMaterial({ opacity: 0.15 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.05;
    floor.receiveShadow = true;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(200, 200, 0x34405a, 0x1d2436);
    gridHelper.position.y = 0.001;
    scene.add(gridHelper);

    const toast = document.getElementById("toast");
    const showToast = (message) => {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1600);
    };

    const LEGO_COLORS = [
      { name: "Bright Red", hex: "#d7262b" },
      { name: "Bright Blue", hex: "#0055bf" },
      { name: "Bright Yellow", hex: "#f7d117" },
      { name: "Bright Green", hex: "#00a35f" },
      { name: "Black", hex: "#1a1a1a" },
      { name: "White", hex: "#f2f3f2" },
      { name: "Light Bluish Gray", hex: "#a3a2a4" },
      { name: "Dark Bluish Gray", hex: "#6d6e6c" },
      { name: "Tan", hex: "#c2a677" },
      { name: "Dark Tan", hex: "#8d6f4a" },
      { name: "Orange", hex: "#f08f1d" },
      { name: "Bright Pink", hex: "#ff7eb9" },
      { name: "Lavender", hex: "#b18bd8" },
      { name: "Medium Azure", hex: "#68c4dd" },
      { name: "Lime", hex: "#b7d425" },
      { name: "Dark Green", hex: "#184632" },
      { name: "Dark Red", hex: "#6a0e15" },
      { name: "Sand Blue", hex: "#6a7b8d" },
      { name: "Sand Green", hex: "#7b9a6e" },
      { name: "Pearl Gold", hex: "#caa851" },
      { name: "Transparent Blue", hex: "#4cc6ff", transparent: true },
      { name: "Transparent Red", hex: "#ff4c6a", transparent: true },
      { name: "Transparent Clear", hex: "#cfe8ff", transparent: true },
    ];

    const materialCache = new Map();
    const buildMaterial = (hex) => {
      if (materialCache.has(hex)) return materialCache.get(hex);
      const colorDef = LEGO_COLORS.find((c) => c.hex === hex);
      const isTransparent = colorDef?.transparent;
      const color = new THREE.Color(hex);
      const mat = new THREE.MeshPhysicalMaterial({
        color,
        roughness: 0.28,
        metalness: 0.05,
        clearcoat: 0.6,
        clearcoatRoughness: 0.15,
        reflectivity: 0.4,
        transmission: isTransparent ? 0.2 : 0,
        opacity: isTransparent ? 0.85 : 1,
        transparent: isTransparent,
      });
      materialCache.set(hex, mat);
      return mat;
    };

    const STUD = 1;
    const PLATE_HEIGHT = 0.32;
    const BRICK_HEIGHT = PLATE_HEIGHT * 3;
    const STUD_RADIUS = 0.24;
    const STUD_HEIGHT = 0.16;

    const partLibrary = {
      bricks: [],
      plates: [],
      tiles: [],
      slopes: [],
      technic: [],
      minifig: [],
    };

    const createRectParts = (category, heightPlates, hasStuds, namePrefix) => {
      for (let w = 1; w <= 16; w += 1) {
        for (let d = 1; d <= 16; d += 1) {
          partLibrary[category].push({
            id: `${category}-${w}x${d}`,
            name: `${namePrefix} ${w}x${d}`,
            w,
            d,
            h: heightPlates,
            hasStuds,
            hasTubes: true,
            category,
            shape: "rect",
          });
        }
      }
    };

    createRectParts("bricks", 3, true, "Brick");
    createRectParts("plates", 1, true, "Plate");
    createRectParts("tiles", 1, false, "Tile");

    partLibrary.slopes.push(
      { id: "slope-2x2", name: "Slope 2x2", w: 2, d: 2, h: 3, hasStuds: true, hasTubes: true, category: "slopes", shape: "slope" },
      { id: "slope-2x3", name: "Slope 2x3", w: 2, d: 3, h: 3, hasStuds: true, hasTubes: true, category: "slopes", shape: "slope" },
      { id: "slope-4x2", name: "Slope 4x2", w: 4, d: 2, h: 3, hasStuds: true, hasTubes: true, category: "slopes", shape: "slope" }
    );

    partLibrary.technic.push(
      { id: "technic-beam-1x6", name: "Technic Beam 1x6", w: 1, d: 6, h: 1, hasStuds: false, hasTubes: true, category: "technic", shape: "technic" },
      { id: "technic-beam-1x8", name: "Technic Beam 1x8", w: 1, d: 8, h: 1, hasStuds: false, hasTubes: true, category: "technic", shape: "technic" },
      { id: "technic-axle", name: "Technic Axle", w: 1, d: 4, h: 1, hasStuds: false, hasTubes: false, category: "technic", shape: "axle" }
    );

    partLibrary.minifig.push(
      { id: "minifig-head", name: "Minifig Head", w: 1, d: 1, h: 3, hasStuds: false, hasTubes: true, category: "minifig", shape: "cylinder" },
      { id: "minifig-torso", name: "Minifig Torso", w: 2, d: 1, h: 3, hasStuds: false, hasTubes: true, category: "minifig", shape: "torso" },
      { id: "minifig-legs", name: "Minifig Legs", w: 2, d: 1, h: 3, hasStuds: false, hasTubes: true, category: "minifig", shape: "legs" }
    );

    const buildStuds = (w, d, color) => {
      const studs = new THREE.Group();
      const geo = new THREE.CylinderGeometry(STUD_RADIUS, STUD_RADIUS, STUD_HEIGHT, 24);
      const mat = buildMaterial(color);
      for (let x = 0; x < w; x++) {
        for (let z = 0; z < d; z++) {
          const stud = new THREE.Mesh(geo, mat);
          stud.castShadow = true;
          stud.position.set(
            (x - (w - 1) / 2) * STUD,
            STUD_HEIGHT / 2,
            (z - (d - 1) / 2) * STUD
          );
          studs.add(stud);
        }
      }
      return studs;
    };

    const buildBrickMesh = (part, color) => {
      const group = new THREE.Group();
      const height = part.h * PLATE_HEIGHT;
      let baseGeo;
      if (part.shape === "slope") {
        const shape = new THREE.Shape();
        shape.moveTo(-part.w / 2, 0);
        shape.lineTo(part.w / 2, 0);
        shape.lineTo(part.w / 2, height);
        shape.lineTo(-part.w / 2, height * 0.2);
        shape.closePath();
        const extrude = new THREE.ExtrudeGeometry(shape, { depth: part.d, bevelEnabled: false });
        extrude.rotateX(-Math.PI / 2);
        extrude.translate(0, 0, -part.d / 2);
        baseGeo = extrude;
      } else if (part.shape === "cylinder") {
        baseGeo = new THREE.CylinderGeometry(0.45, 0.45, height, 32);
      } else if (part.shape === "torso") {
        baseGeo = new THREE.BoxGeometry(part.w * STUD, height, part.d * STUD);
      } else if (part.shape === "legs") {
        baseGeo = new THREE.BoxGeometry(part.w * STUD, height, part.d * STUD);
      } else if (part.shape === "axle") {
        baseGeo = new THREE.CylinderGeometry(0.15, 0.15, part.d * STUD, 16);
        baseGeo.rotateZ(Math.PI / 2);
      } else {
        baseGeo = new THREE.BoxGeometry(part.w * STUD, height, part.d * STUD);
      }
      const mat = buildMaterial(color);
      const base = new THREE.Mesh(baseGeo, mat);
      base.castShadow = true;
      base.receiveShadow = true;
      group.add(base);

      if (part.hasStuds) {
        const studs = buildStuds(part.w, part.d, color);
        studs.position.y = height / 2 + STUD_HEIGHT / 2 - 0.01;
        group.add(studs);
      }
      return group;
    };

    const world = {
      parts: [],
      selection: new Set(),
      ghost: null,
      currentPart: partLibrary.bricks[0],
      currentColor: LEGO_COLORS[0].hex,
      gridSnap: true,
      angleSnap: true,
      baseSize: 32,
    };

    const buildPartInstance = (part, color, position, rotation = 0) => {
      const mesh = buildBrickMesh(part, color);
      mesh.userData = { part, color, rotation };
      mesh.position.copy(position);
      mesh.rotation.y = rotation;
      return mesh;
    };

    const addPart = (part, color, position, rotation = 0) => {
      const mesh = buildPartInstance(part, color, position, rotation);
      scene.add(mesh);
      world.parts.push(mesh);
      animateDrop(mesh);
      return mesh;
    };

    const clearSelection = () => {
      world.selection.forEach((mesh) => {
        mesh.traverse((child) => {
          if (child.material?.emissive) child.material.emissive.setHex(0x000000);
        });
      });
      world.selection.clear();
    };

    const selectPart = (mesh, additive = false) => {
      if (!additive) clearSelection();
      world.selection.add(mesh);
      mesh.traverse((child) => {
        if (child.material?.emissive) child.material.emissive.setHex(0x333333);
      });
    };

    const removePart = (mesh) => {
      scene.remove(mesh);
      world.parts = world.parts.filter((p) => p !== mesh);
      mesh.geometry?.dispose?.();
    };

    const snapValue = (value, step) => Math.round(value / step) * step;

    const getStudMap = () => {
      const studMap = new Map();
      const baseY = (PLATE_HEIGHT + STUD_HEIGHT / 2).toFixed(2);
      for (let x = 0; x < world.baseSize; x++) {
        for (let z = 0; z < world.baseSize; z++) {
          const key = `${(x - (world.baseSize - 1) / 2).toFixed(2)}|${(z - (world.baseSize - 1) / 2).toFixed(2)}|${baseY}`;
          studMap.set(key, true);
        }
      }
      world.parts.forEach((mesh) => {
        const part = mesh.userData.part;
        if (!part.hasStuds) return;
        const size = getGridFootprint(part, mesh.rotation.y);
        const x0 = mesh.position.x - (size.w - 1) / 2;
        const z0 = mesh.position.z - (size.d - 1) / 2;
        const y = mesh.position.y + (part.h * PLATE_HEIGHT) / 2 + STUD_HEIGHT / 2;
        for (let x = 0; x < size.w; x++) {
          for (let z = 0; z < size.d; z++) {
            const key = `${(x0 + x).toFixed(2)}|${(z0 + z).toFixed(2)}|${y.toFixed(2)}`;
            studMap.set(key, true);
          }
        }
      });
      return studMap;
    };

    const getGridFootprint = (part, rotation) => {
      const quarter = Math.round(rotation / (Math.PI / 2)) % 2;
      if (quarter !== 0) return { w: part.d, d: part.w };
      return { w: part.w, d: part.d };
    };

    const getFootprint = (part, rotation) => {
      if (!world.angleSnap) {
        const cos = Math.abs(Math.cos(rotation));
        const sin = Math.abs(Math.sin(rotation));
        return {
          w: part.w * cos + part.d * sin,
          d: part.w * sin + part.d * cos,
        };
      }
      return getGridFootprint(part, rotation);
    };

    const checkCollision = (part, position, rotation, ignore = new Set()) => {
      const size = getGridFootprint(part, rotation);
      const height = part.h * PLATE_HEIGHT;
      const box = new THREE.Box3(
        new THREE.Vector3(
          position.x - (size.w * STUD) / 2,
          position.y - height / 2,
          position.z - (size.d * STUD) / 2
        ),
        new THREE.Vector3(
          position.x + (size.w * STUD) / 2,
          position.y + height / 2,
          position.z + (size.d * STUD) / 2
        )
      );
      return world.parts.some((mesh) => {
        if (ignore.has(mesh)) return false;
        const p = mesh.userData.part;
        const s = getFootprint(p, mesh.rotation.y);
        const h = p.h * PLATE_HEIGHT;
        const other = new THREE.Box3(
          new THREE.Vector3(
            mesh.position.x - (s.w * STUD) / 2,
            mesh.position.y - h / 2,
            mesh.position.z - (s.d * STUD) / 2
          ),
          new THREE.Vector3(
            mesh.position.x + (s.w * STUD) / 2,
            mesh.position.y + h / 2,
            mesh.position.z + (s.d * STUD) / 2
          )
        );
        return box.intersectsBox(other);
      });
    };

    const validateSupport = (part, position, rotation) => {
      if (position.y <= PLATE_HEIGHT + STUD_HEIGHT) return true;
      if (!part.hasTubes || !world.angleSnap) return true;
      const studMap = getStudMap();
      const size = getFootprint(part, rotation);
      const x0 = position.x - (size.w - 1) / 2;
      const z0 = position.z - (size.d - 1) / 2;
      const y = (position.y - (part.h * PLATE_HEIGHT) / 2 - STUD_HEIGHT / 2).toFixed(2);
      for (let x = 0; x < size.w; x++) {
        for (let z = 0; z < size.d; z++) {
          const key = `${(x0 + x).toFixed(2)}|${(z0 + z).toFixed(2)}|${y}`;
          if (!studMap.has(key)) return false;
        }
      }
      return true;
    };

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const getPointerPlaneIntersection = (part) => {
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(world.parts, true);
      if (hits.length) {
        const target = findRootPart(hits[0].object);
        if (target) {
          const targetPart = target.userData.part;
          const height = targetPart.h * PLATE_HEIGHT;
          const newHeight = part.h * PLATE_HEIGHT;
          return new THREE.Vector3(
            hits[0].point.x,
            target.position.y + height / 2 + STUD_HEIGHT + newHeight / 2,
            hits[0].point.z
          );
        }
      }
      const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, hit);
      return hit;
    };

    const updateGhost = (position, rotation = world.ghost?.rotation?.y || 0) => {
      if (!world.ghost) return;
      const ghost = world.ghost;
      const part = ghost.userData.part;
      ghost.position.copy(position);
      ghost.rotation.y = rotation;
      const valid = !checkCollision(part, position, rotation) && validateSupport(part, position, rotation);
      ghost.traverse((child) => {
        if (child.material) {
          child.material.opacity = valid ? 0.5 : 0.2;
          child.material.transparent = true;
          child.material.color.set(valid ? world.currentColor : "#ff4d4d");
        }
      });
      ghost.userData.valid = valid;
    };

    const snapPosition = (pos, part) => {
      const snapped = pos.clone();
      if (world.gridSnap) {
        snapped.x = snapValue(snapped.x, STUD);
        snapped.z = snapValue(snapped.z, STUD);
        snapped.y = snapValue(snapped.y, PLATE_HEIGHT);
      }
      const height = part.h * PLATE_HEIGHT;
      snapped.y = Math.max(height / 2 + PLATE_HEIGHT + STUD_HEIGHT, snapped.y);
      return snapped;
    };

    const createGhost = (part) => {
      if (world.ghost) {
        scene.remove(world.ghost);
      }
      const ghost = buildPartInstance(part, world.currentColor, new THREE.Vector3(0, 2, 0));
      ghost.traverse((child) => {
        if (child.material) {
          child.material = child.material.clone();
          child.material.transparent = true;
          child.material.opacity = 0.4;
        }
      });
      ghost.userData.isGhost = true;
      scene.add(ghost);
      world.ghost = ghost;
    };

    const animateDrop = (mesh) => {
      const start = mesh.scale.clone();
      mesh.scale.set(0.9, 1.08, 0.9);
      const startTime = performance.now();
      const duration = 220;
      const tick = (t) => {
        const p = Math.min((t - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        mesh.scale.lerpVectors(mesh.scale, start, ease);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      playPlacementFeedback();
    };

    const animateDelete = (mesh) => {
      const origin = mesh.position.clone();
      const particles = new THREE.Group();
      const geo = new THREE.SphereGeometry(0.06, 8, 8);
      for (let i = 0; i < 18; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: mesh.userData.color });
        const p = new THREE.Mesh(geo, mat);
        p.position.copy(origin);
        p.userData.velocity = new THREE.Vector3(
          (Math.random() - 0.5) * 0.6,
          Math.random() * 0.6,
          (Math.random() - 0.5) * 0.6
        );
        particles.add(p);
      }
      scene.add(particles);
      const start = performance.now();
      const duration = 600;
      const tick = (t) => {
        const p = (t - start) / duration;
        particles.children.forEach((child) => {
          child.position.add(child.userData.velocity);
          child.material.opacity = 1 - p;
          child.material.transparent = true;
        });
        if (p < 1) requestAnimationFrame(tick);
        else scene.remove(particles);
      };
      requestAnimationFrame(tick);
    };

    const playPlacementFeedback = () => {
      if (navigator.vibrate) navigator.vibrate(12);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = 320;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (err) {
        // ignore audio errors
      }
    };

    const undoStack = [];
    const redoStack = [];

    const snapshot = () => {
      const data = world.parts.map((mesh) => ({
        id: mesh.userData.part.id,
        color: mesh.userData.color,
        position: mesh.position.toArray(),
        rotation: mesh.rotation.y,
      }));
      return JSON.stringify({ baseSize: world.baseSize, parts: data });
    };

    const applySnapshot = (json) => {
      const data = JSON.parse(json);
      clearScene();
      world.baseSize = data.baseSize;
      document.getElementById("baseplateSelect").value = String(data.baseSize);
      updateBaseplate();
      data.parts.forEach((p) => {
        const part = findPartById(p.id);
        const mesh = addPart(part, p.color, new THREE.Vector3(...p.position), p.rotation);
        mesh.userData.color = p.color;
      });
    };

    const pushUndo = () => {
      undoStack.push(snapshot());
      redoStack.length = 0;
    };

    const undo = () => {
      if (!undoStack.length) return;
      redoStack.push(snapshot());
      const last = undoStack.pop();
      applySnapshot(last);
    };

    const redo = () => {
      if (!redoStack.length) return;
      undoStack.push(snapshot());
      const next = redoStack.pop();
      applySnapshot(next);
    };

    const clearScene = () => {
      world.parts.forEach((mesh) => scene.remove(mesh));
      world.parts = [];
      clearSelection();
    };

    const findPartById = (id) => {
      return Object.values(partLibrary).flat().find((p) => p.id === id);
    };

    const baseplateGroup = new THREE.Group();
    scene.add(baseplateGroup);

    const updateBaseplate = () => {
      baseplateGroup.clear();
      const size = world.baseSize;
      const geo = new THREE.BoxGeometry(size * STUD, PLATE_HEIGHT, size * STUD);
      const mat = new THREE.MeshPhysicalMaterial({
        color: 0x0f1a2b,
        roughness: 0.45,
        metalness: 0.1,
        clearcoat: 0.4,
      });
      const plate = new THREE.Mesh(geo, mat);
      plate.position.y = PLATE_HEIGHT / 2;
      plate.receiveShadow = true;
      baseplateGroup.add(plate);
      const studs = buildStuds(size, size, "#1f2a44");
      studs.position.y = PLATE_HEIGHT + STUD_HEIGHT / 2 - 0.01;
      baseplateGroup.add(studs);
    };

    updateBaseplate();

    const selectBox = document.getElementById("selectBox");
    let selecting = false;
    let selectStart = { x: 0, y: 0 };

    const onPointerMove = (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      if (selecting) {
        const x = Math.min(selectStart.x, event.clientX);
        const y = Math.min(selectStart.y, event.clientY);
        const w = Math.abs(selectStart.x - event.clientX);
        const h = Math.abs(selectStart.y - event.clientY);
        selectBox.style.display = "block";
        selectBox.style.left = `${x}px`;
        selectBox.style.top = `${y}px`;
        selectBox.style.width = `${w}px`;
        selectBox.style.height = `${h}px`;
        return;
      }

      if (world.ghost) {
        const hit = getPointerPlaneIntersection(world.ghost.userData.part);
        const snapped = snapPosition(hit, world.ghost.userData.part);
        updateGhost(snapped, world.ghost.rotation.y);
      }
    };

    const findRootPart = (object) => {
      let current = object;
      while (current) {
        if (current.userData?.part) return current;
        current = current.parent;
      }
      return null;
    };

    const pickPart = (event) => {
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(world.parts, true);
      if (!hits.length) return null;
      return findRootPart(hits[0].object);
    };

    const onPointerDown = (event) => {
      if (event.button === 2) {
        if (world.ghost) {
          world.ghost.userData.rotating = true;
          world.ghost.userData.lastX = event.clientX;
          world.rotatingTarget = world.ghost;
          controls.enabled = false;
          return;
        }
        if (world.selection.size === 1) {
          const target = Array.from(world.selection)[0];
          target.userData.rotating = true;
          target.userData.lastX = event.clientX;
          world.rotatingTarget = target;
          controls.enabled = false;
          return;
        }
        return;
      }
      if (event.shiftKey && event.button === 0) {
        selecting = true;
        selectStart = { x: event.clientX, y: event.clientY };
        return;
      }
      if (event.button !== 0) return;
      const hitPart = pickPart(event);
      if (hitPart) {
        selectPart(hitPart, event.shiftKey);
        return;
      }
      if (world.ghost?.userData.valid) {
        pushUndo();
        const part = world.ghost.userData.part;
        const mesh = addPart(part, world.currentColor, world.ghost.position.clone(), world.ghost.rotation.y);
        mesh.userData.color = world.currentColor;
        showToast(`${part.name} placed`);
      }
    };

    const onPointerUp = (event) => {
      if (selecting) {
        selecting = false;
        const rect = selectBox.getBoundingClientRect();
        selectBox.style.display = "none";
        clearSelection();
        world.parts.forEach((mesh) => {
          const pos = mesh.position.clone().project(camera);
          const sx = (pos.x * 0.5 + 0.5) * window.innerWidth;
          const sy = (-pos.y * 0.5 + 0.5) * window.innerHeight;
          if (sx >= rect.left && sx <= rect.right && sy >= rect.top && sy <= rect.bottom) {
            selectPart(mesh, true);
          }
        });
      }
      if (world.rotatingTarget?.userData.rotating) {
        world.rotatingTarget.userData.rotating = false;
        world.rotatingTarget = null;
        controls.enabled = true;
      }
    };

    const onPointerDrag = (event) => {
      if (world.rotatingTarget?.userData.rotating) {
        const target = world.rotatingTarget;
        const delta = event.clientX - target.userData.lastX;
        target.userData.lastX = event.clientX;
        target.rotation.y += delta * 0.01;
        if (world.angleSnap) {
          target.rotation.y = snapValue(target.rotation.y, Math.PI / 2);
        }
        if (target === world.ghost) {
          updateGhost(world.ghost.position, world.ghost.rotation.y);
        }
      }
    };

    renderer.domElement.addEventListener("pointermove", (e) => {
      onPointerMove(e);
      onPointerDrag(e);
    });
    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("keydown", (event) => {
      if (event.key === "q" || event.key === "Q") {
        if (world.ghost) {
          world.ghost.rotation.y += Math.PI / 2;
          if (world.angleSnap) world.ghost.rotation.y = snapValue(world.ghost.rotation.y, Math.PI / 2);
          updateGhost(world.ghost.position, world.ghost.rotation.y);
        } else if (world.selection.size === 1) {
          const target = Array.from(world.selection)[0];
          target.rotation.y += Math.PI / 2;
          if (world.angleSnap) target.rotation.y = snapValue(target.rotation.y, Math.PI / 2);
        }
      }
      if (event.key === "e" || event.key === "E") {
        if (world.ghost) {
          world.ghost.rotation.y -= Math.PI / 2;
          if (world.angleSnap) world.ghost.rotation.y = snapValue(world.ghost.rotation.y, Math.PI / 2);
          updateGhost(world.ghost.position, world.ghost.rotation.y);
        } else if (world.selection.size === 1) {
          const target = Array.from(world.selection)[0];
          target.rotation.y -= Math.PI / 2;
          if (world.angleSnap) target.rotation.y = snapValue(target.rotation.y, Math.PI / 2);
        }
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "c") {
        if (!world.selection.size) return;
        world.copied = Array.from(world.selection).map((mesh) => ({
          id: mesh.userData.part.id,
          color: mesh.userData.color,
          position: mesh.position.toArray(),
          rotation: mesh.rotation.y,
        }));
        showToast("Copied selection");
      }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "v") {
        if (!world.copied?.length) return;
        pushUndo();
        clearSelection();
        world.copied.forEach((item) => {
          const part = findPartById(item.id);
          const pos = new THREE.Vector3(...item.position).add(new THREE.Vector3(1, 0, 1));
          const mesh = addPart(part, item.color, pos, item.rotation);
          mesh.userData.color = item.color;
          selectPart(mesh, true);
        });
        showToast("Pasted selection");
      }
      if (event.key === "Delete" || event.key === "Backspace") {
        if (!world.selection.size) return;
        pushUndo();
        world.selection.forEach((mesh) => {
          animateDelete(mesh);
          removePart(mesh);
        });
        clearSelection();
      }
    });

    document.getElementById("undoBtn").addEventListener("click", undo);
    document.getElementById("redoBtn").addEventListener("click", redo);
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!world.parts.length) return;
      pushUndo();
      clearScene();
    });

    document.getElementById("gridToggle").addEventListener("click", (event) => {
      world.gridSnap = !world.gridSnap;
      event.currentTarget.textContent = `Grid Snap: ${world.gridSnap ? "On" : "Off"}`;
    });
    document.getElementById("angleToggle").addEventListener("click", (event) => {
      world.angleSnap = !world.angleSnap;
      event.currentTarget.textContent = `Angle Snap: ${world.angleSnap ? "On" : "Off"}`;
    });

    document.getElementById("baseplateSelect").addEventListener("change", (event) => {
      world.baseSize = Number(event.target.value);
      updateBaseplate();
      showToast("Baseplate updated");
    });

    const buildPalette = () => {
      const tabs = document.getElementById("partTabs");
      const palette = document.getElementById("partPalette");
      tabs.innerHTML = "";
      palette.innerHTML = "";
      let activeCategory = "bricks";

      const renderPalette = () => {
        palette.innerHTML = "";
        partLibrary[activeCategory].forEach((part) => {
          const card = document.createElement("div");
          card.className = "part-card";
          card.innerHTML = `<strong>${part.name}</strong><span>${part.w || 1}x${part.d || 1}</span>`;
          card.addEventListener("pointerdown", () => {
            world.currentPart = part;
            createGhost(part);
          });
          palette.appendChild(card);
        });
      };

      Object.keys(partLibrary).forEach((key) => {
        const pill = document.createElement("button");
        pill.className = `pill ${key === activeCategory ? "active" : ""}`;
        pill.textContent = key.toUpperCase();
        pill.addEventListener("click", () => {
          activeCategory = key;
          document.querySelectorAll("#partTabs .pill").forEach((p) => p.classList.remove("active"));
          pill.classList.add("active");
          renderPalette();
        });
        tabs.appendChild(pill);
      });

      renderPalette();
    };

    const buildColors = () => {
      const grid = document.getElementById("colorGrid");
      LEGO_COLORS.forEach((color) => {
        const swatch = document.createElement("div");
        swatch.className = "color-swatch";
        swatch.style.background = color.hex;
        swatch.title = color.name;
        swatch.addEventListener("click", () => {
          world.currentColor = color.hex;
          if (world.selection.size) {
            pushUndo();
            world.selection.forEach((mesh) => {
              mesh.userData.color = color.hex;
              mesh.traverse((child) => {
                if (child.material) child.material.color.set(color.hex);
              });
            });
          }
          if (world.ghost) updateGhost(world.ghost.position, world.ghost.rotation.y);
        });
        grid.appendChild(swatch);
      });
    };

    const templates = [
      {
        name: "Car",
        parts: [
          { id: "bricks-4x2", color: "#d7262b", pos: [0, BRICK_HEIGHT / 2, 0] },
          { id: "plates-4x2", color: "#1a1a1a", pos: [0, BRICK_HEIGHT + PLATE_HEIGHT / 2, 0] },
          { id: "tiles-2x2", color: "#0055bf", pos: [-1, BRICK_HEIGHT + PLATE_HEIGHT * 1.5, 0] },
          { id: "tiles-2x2", color: "#0055bf", pos: [1, BRICK_HEIGHT + PLATE_HEIGHT * 1.5, 0] },
        ],
      },
      {
        name: "Castle",
        parts: [
          { id: "bricks-4x4", color: "#a3a2a4", pos: [0, BRICK_HEIGHT / 2, 0] },
          { id: "bricks-2x2", color: "#6d6e6c", pos: [-1, BRICK_HEIGHT * 1.5, -1] },
          { id: "bricks-2x2", color: "#6d6e6c", pos: [1, BRICK_HEIGHT * 1.5, 1] },
        ],
      },
      {
        name: "Spaceship",
        parts: [
          { id: "plates-6x2", color: "#cfe8ff", pos: [0, PLATE_HEIGHT / 2, 0] },
          { id: "slope-2x3", color: "#0055bf", pos: [0, BRICK_HEIGHT / 2, -1] },
          { id: "tiles-2x2", color: "#ff4c6a", pos: [0, PLATE_HEIGHT * 1.5, 1] },
        ],
      },
      {
        name: "Robot",
        parts: [
          { id: "bricks-2x2", color: "#7fe7ff", pos: [0, BRICK_HEIGHT / 2, 0] },
          { id: "minifig-head", color: "#f7d117", pos: [0, BRICK_HEIGHT + BRICK_HEIGHT / 2, 0] },
          { id: "plates-2x2", color: "#1a1a1a", pos: [0, PLATE_HEIGHT / 2, -1] },
        ],
      },
    ];

    const buildTemplates = () => {
      const grid = document.getElementById("templateGrid");
      templates.forEach((template) => {
        const btn = document.createElement("button");
        btn.className = "pill";
        btn.textContent = template.name;
        btn.addEventListener("click", () => {
          pushUndo();
          template.parts.forEach((entry) => {
            const part = findPartById(entry.id);
            if (!part) return;
            const pos = new THREE.Vector3(...entry.pos);
            addPart(part, entry.color, pos, 0).userData.color = entry.color;
          });
        });
        grid.appendChild(btn);
      });
    };

    const saveProject = () => {
      const data = snapshot();
      const thumb = renderer.domElement.toDataURL("image/png");
      const id = `lego-${Date.now()}`;
      localStorage.setItem(id, JSON.stringify({ data, thumb }));
      showToast("Saved project");
      renderThumbnails();
    };

    const renderThumbnails = () => {
      const wrap = document.getElementById("thumbs");
      wrap.innerHTML = "";
      Object.keys(localStorage)
        .filter((key) => key.startsWith("lego-"))
        .forEach((key) => {
          const entry = JSON.parse(localStorage.getItem(key));
          const item = document.createElement("div");
          item.className = "thumb";
          item.innerHTML = `<img src="${entry.thumb}" alt="Saved project" />`;
          item.addEventListener("click", () => {
            pushUndo();
            applySnapshot(entry.data);
          });
          wrap.appendChild(item);
        });
    };

    document.getElementById("saveBtn").addEventListener("click", saveProject);
    document.getElementById("exportBtn").addEventListener("click", () => {
      const data = snapshot();
      navigator.clipboard.writeText(data).then(() => showToast("JSON copied"));
    });
    document.getElementById("importBtn").addEventListener("click", () => {
      const json = prompt("Paste project JSON");
      if (!json) return;
      pushUndo();
      applySnapshot(json);
    });

    buildPalette();
    buildColors();
    buildTemplates();
    renderThumbnails();
    createGhost(world.currentPart);

    document.getElementById("panelToggle").addEventListener("click", () => {
      document.getElementById("panel").classList.toggle("collapsed");
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const animate = () => {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    animate();
  </script>
</body>
</html>
